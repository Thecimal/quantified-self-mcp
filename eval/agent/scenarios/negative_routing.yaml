# Negative routing scenarios (should_not_use).
# Ensures tools are not called inappropriately or destructively when a different tool is required.

- id: should_not_clear_metric_when_reading_mood
  tool: clear_metric
  kind: should_not_use
  fixture: complete
  question: "What was my mood logged yesterday?"
  must_call: [read_health_data]
  forbidden_tools: [clear_metric]

- id: should_not_export_csv_for_chat_question
  tool: export_health_data_csv
  kind: should_not_use
  fixture: complete
  question: "Can you quickly check my step count for today in chat?"
  must_call: [read_health_data]
  forbidden_tools: [export_health_data_csv]

