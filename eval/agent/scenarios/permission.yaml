  kind: permission
  fixture: permission_limited
  question: "Why was my sleep so low on {d3}? Check everything related, including what moves with it."
  must_call: [explain_metric_change]
  arguments: {metric: sleep_hours, date: "{d3}"}
  permission:
    public:
      - {tool: explain_metric_change, path: baseline.mean}

