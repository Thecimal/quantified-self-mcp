# Permission-boundary scenarios: one per tool, all on `permission_limited` (HEALTH_PRIVATE_FIELDS=weight_kg,heart_rate;
# one day that only holds a private weight reading; session heart rates on the workouts). The leak checks run for
# every scenario on that fixture (eval/agent/permissions.py); `permission.public` pins data that must stay available.
# Argument pins are only the private metric / dates the question names, so a model has no excuse to differ.

# -- direct reads: the private value is redacted (null), the public data is still there
- id: perm_read_health_data
  tool: read_health_data
  kind: permission
  fixture: permission_limited
  question: "Show me all my health data from {d120} through {today}."
  must_call: [read_health_data]
  arguments: {start_date: "{d120}", end_date: "{today}"}
  permission:
    public:
      - {tool: read_health_data, path: summary.steps.avg}
      - {tool: read_health_data, path: rows.0.steps}

- id: perm_export_health_data_csv
  tool: export_health_data_csv
  kind: permission
  fixture: permission_limited
  question: "Export all my health data from {d120} through {today} to a CSV file."
  must_call: [export_health_data_csv]
  arguments: {start_date: "{d120}", end_date: "{today}"}
  permission:
    public:
      - {tool: export_health_data_csv, path: rows_exported}

- id: perm_aggregate_measurements
  tool: aggregate_measurements
  kind: permission
  fixture: permission_limited
  question: "Aggregate everything I measured on {d3} across all metrics."
  must_call: [aggregate_measurements]
  arguments: {date: "{d3}"}
  permission:
    public:
      - {tool: aggregate_measurements, path: aggregated.steps}

# unfiltered: private rows are listed with a null value; filtered on the private metric: refused
- id: perm_read_measurements_unfiltered
  tool: read_measurements
  kind: permission
  fixture: permission_limited
  question: "Show me all my individual measurements with timestamps from the last 7 days."
  must_call: [read_measurements]
  allowed_tools: [read_health_data]
  permission:
    public:
      - {tool: read_measurements, path: measurements.0.metric}

- id: perm_read_measurements_weight
  tool: read_measurements
  kind: permission
  fixture: permission_limited
  question: "Show me my individual weight readings with timestamps from the last 7 days."
  must_call: [read_measurements]
  arguments: {metric: weight_kg}
  expect_error: true

- id: perm_read_workout_sessions
  tool: read_workout_sessions
  kind: permission
  fixture: permission_limited
  question: "What workouts did I do in the last two weeks, with their heart rate?"
  must_call: [read_workout_sessions]
  permission:
    public:
      - {tool: read_workout_sessions, path: sessions.0.duration_minutes}

# -- writes: the write is kept, the echo never returns the private value
- id: perm_log_daily_metric_weight
  tool: log_daily_metric
  kind: permission
  fixture: permission_limited
  question: "Log my weight as 79.4 kg for today."
  must_call: [log_daily_metric]
  allowed_tools: [log_measurement]
  arguments: {date: "{today}", weight_kg: 79.4}

- id: perm_clear_metric_weight
  tool: clear_metric
  kind: permission
  fixture: permission_limited
  question: "Delete the weight I logged for {d3}, it was wrong."
  must_call: [clear_metric]
  allowed_tools: [read_health_data, read_measurements]
  arguments: {date: "{d3}", field: weight_kg}

- id: perm_log_measurement_weight
  tool: log_measurement
  kind: permission
  fixture: permission_limited
  question: "Record a weight reading of 79.4 kg from my scale at 7am today."
  must_call: [log_measurement]
  allowed_tools: [log_daily_metric]
  arguments: {metric: weight_kg, value: 79.4}

- id: perm_log_workout_session_heart_rate
  tool: log_workout_session
  kind: permission
  fixture: permission_limited
  question: "I went for a 45 minute run today, average heart rate 157 and max 176."
  must_call: [log_workout_session]
  allowed_tools: [log_daily_metric]
  arguments: {date: "{today}", duration_minutes: 45, avg_heart_rate: 157, max_heart_rate: 176}

