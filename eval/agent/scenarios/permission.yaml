# -- composites and status: nothing private leaks through nested fields, summaries, correlations or coverage dates
- id: perm_get_recent_changes
  tool: get_recent_changes
  kind: permission
  fixture: permission_limited
  question: "What has changed across all my metrics over the last 7 days?"
  must_call: [get_recent_changes]
  permission:
    public:
      - {tool: get_recent_changes, path: changes.0.detail}

- id: perm_explain_metric_change_sleep
