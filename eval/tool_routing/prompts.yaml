# Tool-routing eval prompts for quantified-self-mcp.
#
# Each entry is one simulated user turn. `canonical` is the tool a careful
# human reviewer would pick as the best answer; `acceptable` lists other
# tools that would also produce a reasonable answer (not wrong, just not
# the tightest fit). Anything outside canonical+acceptable is scored wrong.
#
# `category` groups prompts by *why* they're hard, so failures point at a
# fix instead of just a percentage:
#   unambiguous          - sanity baseline, should be ~100% canonical
#   layer_boundary        - raw data vs. analytics tool for the same metric
#   granularity_adversarial - point-in-time vs. trend vs. history wording
#   causal_adversarial    - "why" / "explain" vs. "what changed"
#   comparison            - explicit period-vs-period vs. plain trend
#   write_intent          - make sure read tools aren't picked for writes
#
# Tool names below are best-guesses based on the project's stated design.
# Run `run_eval.py --dump-tools` against your live server first and fix
# any name here that doesn't match — the harness will also warn you at
# eval time if a referenced tool isn't found on the server.

