# Tool-routing eval prompts for quantified-self-mcp.
#
# Tool names below were fixed against a live --dump-tools run (18 tools,
# see git history for the earlier best-guess version that got several of
# these wrong: get_daily_summary doesn't exist, and calculate_trend /
# compare_periods / detect_anomalies / find_correlations are actually
# calculate_metric_trend / compare_metric_periods / detect_metric_anomalies
# / find_metric_correlation).
#
# `canonical` is the tool a careful human reviewer would pick as the best
# answer; `acceptable` lists other tools that would also produce a
# reasonable answer (not wrong, just not the tightest fit). Anything
# outside canonical+acceptable is scored wrong.
#
# category groups:
#   unambiguous            - sanity baseline, should be ~100% canonical
#   layer_boundary          - daily-aggregate vs. history/trend tool for the same metric
#   granularity_adversarial - point-in-time vs. trend vs. history wording
#   causal_adversarial      - "why" / "explain" vs. "what changed"
#   comparison              - explicit period-vs-period vs. plain trend
#   write_intent            - daily aggregate vs. raw single-observation writes
#   raw_vs_aggregate         - read_health_data/read_measurements/get_metric_provenance
#   workout_logging          - log_workout_session vs. log_daily_metric's workout_minutes
#   export_intent            - export_health_data_csv
#
# If you add or rename a tool, re-run `run_eval.py --dump-tools` and
# check this file against the output before trusting scores again.

