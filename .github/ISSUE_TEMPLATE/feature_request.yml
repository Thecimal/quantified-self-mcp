name: Feature Request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.

        For significant features, please describe the privacy and security implications.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other ways to solve this problem?

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security considerations
      description: |
        Could this feature expose additional personal data, require network access,
        introduce write access, or affect the local-first architecture?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, examples, or references.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and feature requests.
          required: true
