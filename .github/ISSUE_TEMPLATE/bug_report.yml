name: Bug Report
description: Report a reproducible problem with Quantified Self MCP
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        Please do not include real personal health data, credentials, API keys,
        tokens, or private databases.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clearly describe the problem.
      placeholder: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce the issue.
      placeholder: |
        1. Start the server
        2. Run ...
        3. Call tool ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Quantified Self MCP version or commit
      placeholder: e.g. v1.0.0 or commit hash

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. Python 3.12.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
