name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run test suite
        run: pytest tests/ qs_evidence/tests -v

      - name: Check server.py syntax
        run: python -m py_compile server.py && echo "server.py OK"

      - name: Check init_db.py syntax
        run: python -m py_compile init_db.py && echo "init_db.py OK"

      - name: Check import_adapters.py syntax
        run: python -m py_compile import_adapters.py && echo "import_adapters.py OK"

      - name: Test database initialization
        run: |
          python init_db.py sample_data/health_sample.csv
          python -c "
          import sqlite3
          conn = sqlite3.connect('data/health.db')
          count = conn.execute('SELECT COUNT(*) FROM daily_metrics').fetchone()[0]
          assert count > 0, 'No rows loaded'
          print(f'health.db OK — {count} rows')
          "

      - name: Test server imports cleanly
        run: python -c "import server; print('server imports OK')"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Verify wheel contains all required modules
        run: |
          pip install --force-reinstall dist/*.whl
          (cd /tmp && python -c "import server, init_db, doctor, logic, tools.health, db.invariant; print('isolated wheel import OK')")
          python - <<'PY'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist())
          required = {
              'server.py', 'init_db.py', 'logic.py', 'metric_registry.py', 'analytics.py', 'evidence.py',
              'import_adapters.py', 'data_health.py', 'doctor.py', 'errors.py', 'ingest.py', 'privacy.py',
              'schemas.py', 'source_coverage.py',
              'tools/__init__.py', 'tools/health.py', 'tools/measurements.py', 'tools/status.py', 'tools/workouts.py',
              'db/__init__.py', 'db/schema.sql', 'db/invariant.py', 'db/aggregation.py',
              'qs_evidence/__init__.py', 'qs_evidence/models.py', 'qs_evidence/registry.py',
              'qs_evidence/registry.yaml', 'qs_evidence/resolver.py', 'qs_evidence/sample.py',
              'integrations/jev/__init__.py', 'integrations/jev/adapter.py', 'integrations/jev/schemas.py',
          }
          assert not required - names, sorted(required - names)
          assert not [n for n in names if n.startswith('qs_evidence/tests')], 'tests leaked into wheel'
          print('wheel file list OK')
          PY
