name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  # Fail fast, before anything is built: the tag must be v<version from pyproject.toml>.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: python .github/scripts/check_tag_matches_version.py "$GITHUB_REF_NAME"

  # The whole CI workflow (lint, tests on every supported Python, build, wheel contents) must pass
  # on the tagged commit before anything is uploaded.
  ci:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: pip install -r requirements-dev.txt

      - name: Build package
        run: python -m build

      - name: Smoke-test the exact wheel that will be uploaded
        run: |
          QS_SMOKE_WHEEL="$(ls dist/*.whl)" QS_SMOKE_ISOLATED=1 python -m pytest -q tests/test_clean_install_smoke.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Sync version in server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          python3 -c "
          import json
          with open('server.json', 'r') as f:
              data = json.load(f)
          data['version'] = '$VERSION'
          if 'packages' in data and data['packages']:
              data['packages'][0]['version'] = '$VERSION'
          with open('server.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
