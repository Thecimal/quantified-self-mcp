[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantified-self-mcp"
version = "0.4.1"
description = "Local MCP server for personal health data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [
    {name = "Behnoud", email = "behnoud.mhm@gmail.com"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "fastmcp",
    "health",
    "quantified-self",
    "local-first",
    "privacy",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastmcp>=4.0.3,<5.0",
    "pydantic>=2.13.5,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/Thecimal/quantified-self-mcp"
Repository = "https://github.com/Thecimal/quantified-self-mcp"
Issues = "https://github.com/Thecimal/quantified-self-mcp/issues"
Changelog = "https://github.com/Thecimal/quantified-self-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# See logic.py's "Database encryption" section and README.md. Not needed
# unless HEALTH_DB_PASSPHRASE is set — everything works exactly as before
# without it.
encryption = ["sqlcipher3-binary>=0.5,<1.0"]

[project.scripts]
quantified-self-mcp = "server:main"
quantified-self-init-db = "init_db:main"
quantified-self-doctor = "doctor:main"

[tool.hatch.build.targets.wheel]
include = [
    "server.py",
    "init_db.py",
    "logic.py",
    "metric_registry.py",
    "analytics.py",
    "evidence.py",
    "import_adapters.py",
    "data_health.py",
    "doctor.py",
    "errors.py",
    "ingest.py",
    "privacy.py",
    "schemas.py",
    "source_coverage.py",
    "tools/*.py",
    "db/*.py",
    "db/schema.sql",
    "qs_evidence/*.py",
    "qs_evidence/registry.yaml",
    "integrations/jev/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
exclude = ["^eval/"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "sqlcipher3.*",
    "generate_sample_data"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "qs_evidence.tests.*"
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "qs_evidence/tests/*",
    "eval/*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError"
]
