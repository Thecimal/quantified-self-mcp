[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantified-self-mcp"
version = "0.2.0"
description = "Local MCP server for personal health data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["fastmcp>=3.0,<4.0", "pydantic>=2.13.5,<3.0"]

[project.optional-dependencies]
# See logic.py's "Database encryption" section and README.md. Not needed
# unless HEALTH_DB_PASSPHRASE is set — everything works exactly as before
# without it.
encryption = ["sqlcipher3-binary>=0.5,<1.0"]

[project.scripts]
quantified-self-mcp = "server:main"
quantified-self-init-db = "init_db:main"

[tool.hatch.build.targets.wheel]
include = ["server.py", "init_db.py", "logic.py", "import_adapters.py"]

[tool.pytest.ini_options]
# asyncio_mode = "auto" lets async def test_* functions and fixtures run
# without needing @pytest.mark.asyncio on every one — used by
# tests/test_mcp_client_integration.py, which drives the server through a
# real (in-memory) fastmcp.Client rather than calling tool functions
# directly.
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's default selection, which
# varies between versions (some recent versions default to a much broader,
# noisier set than E4/E7/E9/F).
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # flake8-bugbear (common bug patterns)
]
