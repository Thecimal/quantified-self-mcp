[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantified-self-mcp"
version = "0.2.2"
description = "Local MCP server for personal health data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastmcp>=4.0.3,<5.0",
    "pydantic>=2.13.5,<3.0",
]

[project.optional-dependencies]
# See logic.py's "Database encryption" section and README.md. Not needed
# unless HEALTH_DB_PASSPHRASE is set — everything works exactly as before
# without it.
encryption = ["sqlcipher3-binary>=0.5,<1.0"]

[project.scripts]
quantified-self-mcp = "server:main"
quantified-self-init-db = "init_db:main"

[tool.hatch.build.targets.wheel]
include = ["server.py", "init_db.py", "logic.py", "analytics.py", "import_adapters.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]
